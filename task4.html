
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Task 4 - Registration Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar navbar-dark bg-dark p-3">
    <a class="navbar-brand" href="index.html">Home</a>
</nav>

<main class="container py-5">
    <h1>Task 4: Registration Form</h1>
    <form id="registrationForm" class="form-panel" novalidate>
        <div class="row g-3">
            <div class="col-md-6">
                <label for="firstName" class="form-label">First Name</label>
                <input id="firstName" type="text" class="form-control"
                       required minlength="2">
                <div class="invalid-feedback">Enter your first name.</div>
            </div>
            <div class="col-md-6">
                <label for="lastName" class="form-label">Last Name</label>
                <input id="lastName" type="text" class="form-control"
                       required minlength="2">
                <div class="invalid-feedback">Enter your last name.</div>
            </div>
            <div class="col-12">
                <label for="regEmail" class="form-label">Email</label>
                <input id="regEmail" type="email" class="form-control" required>
                <div class="invalid-feedback">Enter a valid email.</div>
            </div>
            <div class="col-md-6">
                <label for="password" class="form-label">Password</label>
                <input id="password" type="password" class="form-control"
                       required minlength="8">
                <div class="invalid-feedback">Use at least 8 characters.</div>
            </div>
            <div class="col-md-6">
                <label for="confirmPassword" class="form-label">Confirm Password</label>
                <input id="confirmPassword" type="password" class="form-control"
                       required minlength="8">
                <div class="invalid-feedback">Passwords must match.</div>
            </div>
            <div class="col-12">
                <label class="form-label d-block">Gender</label>
                <div class="form-check form-check-inline">
                    <input id="woman" type="radio" name="gender" value="Woman" class="form-check-input" required>
                    <label for="woman" class="form-check-label">Woman</label>
                </div>
                <div class="form-check form-check-inline">
                    <input id="man" type="radio" name="gender" value="Man" class="form-check-input">
                    <label for="man" class="form-check-label">Man</label>
                </div>
                <div class="form-check form-check-inline">
                    <input id="nonbinary" type="radio" name="gender" value="Non-binary" class="form-check-input">
                    <label for="nonbinary" class="form-check-label">Non-binary</label>
                </div>
            </div>
            <div class="col-12">
                <label class="form-label d-block">Hobbies</label>
                <div class="form-check form-check-inline">
                    <input id="coding" type="checkbox" class="form-check-input" name="hobbies" value="Coding">
                    <label for="coding" class="form-check-label">Coding</label>
                </div>
                <div class="form-check form-check-inline">
                    <input id="gaming" type="checkbox" class="form-check-input" name="hobbies" value="Gaming">
                    <label for="gaming" class="form-check-label">Gaming</label>
                </div>
                <div class="form-check form-check-inline">
                    <input id="music" type="checkbox" class="form-check-input" name="hobbies" value="Music">
                    <label for="music" class="form-check-label">Music</label>
                </div>
            </div>
            <div class="col-12">
                <label for="country" class="form-label">Country</label>
                <select id="country" class="form-select" required>
                    <option value="">Select country</option>
                    <option>Kazakhstan</option>
                    <option>Kyrgyzstan</option>
                    <option>Uzbekistan</option>
                    <option>United States</option>
                    <option>United Kingdom</option>
                    <option>Other</option>
                </select>
                <div class="invalid-feedback">Select a country.</div>
            </div>
            <div class="col-12">
                <button type="submit" class="btn btn-primary">Register</button>
                <button type="reset" class="btn btn-secondary">Reset</button>
            </div>
        </div>
        <p id="registrationStatus" class="mt-3"></p>
    </form>
</main>
<script src="js/main.js"></script>
</body>
</html>
