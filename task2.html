
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Task 2 - Bootstrap Forms</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar navbar-dark bg-dark p-3">
    <a class="navbar-brand" href="index.html">Home</a>
    <a class="text-white" href="task3.html">Next Task →</a>
</nav>

<main class="container py-5">
    <h1>Task 2: Bootstrap Form Styling</h1>
    <form id="bootstrapContact" class="form-panel">
        <div class="row g-3">
            <div class="col-md-6">
                <label for="name" class="form-label">Name</label>
                <input type="text" id="name" class="form-control"
                       placeholder="Enter your name">
                <div class="form-text">Enter your full name.</div>
            </div>
            <div class="col-md-6">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" class="form-control"
                       placeholder="name@example.com">
                <div class="form-text">Enter your email address.</div>
            </div>
            <div class="col-12">
                <label for="message" class="form-label">Message</label>
                <textarea id="message" class="form-control"
                          rows="4" placeholder="Your message"></textarea>
            </div>
            <div class="col-12">
                <button type="submit" class="btn btn-primary">Submit</button>
            </div>
        </div>
        <p id="bootstrapStatus" class="mt-3"></p>
    </form>
</main>
<script src="js/main.js"></script>
</body>
</html>
