
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Task 3 - Validation Styles</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar navbar-dark bg-dark p-3">
    <a class="navbar-brand" href="index.html">Home</a>
    <a class="text-white" href="task4.html">Next Task →</a>
</nav>

<main class="container py-5">
    <h1>Task 3: Bootstrap Validation</h1>
    <form id="styledValidation" class="form-panel" novalidate>
        <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input id="name" type="text" class="form-control"
                   required minlength="2">
            <div class="invalid-feedback">Enter at least 2 characters.</div>
            <div class="valid-feedback">Looks good!</div>
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input id="email" type="email" class="form-control" required>
            <div class="invalid-feedback">Enter a valid email.</div>
            <div class="valid-feedback">Looks good!</div>
        </div>
        <div class="mb-3">
            <label for="message" class="form-label">Message</label>
            <textarea id="message" class="form-control"
                      required minlength="10"></textarea>
            <div class="invalid-feedback">Enter at least 10 characters.</div>
            <div class="valid-feedback">Looks good!</div>
        </div>
        <button type="submit" class="btn btn-primary">Check Form</button>
        <button type="reset" class="btn btn-secondary">Reset</button>
        <p id="styledStatus" class="mt-3"></p>
    </form>
</main>
<script src="js/main.js"></script>
</body>
</html>
