
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Task 1 - HTML5 Validation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar navbar-dark bg-dark p-3">
    <a class="navbar-brand" href="index.html">Home</a>
    <a class="text-white" href="task2.html">Next Task →</a>
</nav>

<main class="container py-5">
    <h1>Task 1: HTML5 Validation</h1>
    <form id="htmlValidationForm" class="form-panel">
        <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" id="name" class="form-control"
                   required minlength="2" maxlength="40">
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" id="email" class="form-control"
                   required maxlength="80">
        </div>
        <div class="mb-3">
            <label for="message" class="form-label">Message</label>
            <textarea id="message" class="form-control"
                      required minlength="10" maxlength="300"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Validate</button>
        <p id="validationStatus" class="mt-3"></p>
    </form>
</main>
<script src="js/main.js"></script>
</body>
</html>
